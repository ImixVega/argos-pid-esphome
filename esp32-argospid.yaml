esphome:
  name: esp32-argospid
  friendly_name: ESP32_ArgosPID
  comment: Bramka Sterownika ArgosPID i Pomiar Zasobnika

esp32:
  board: wt32-eth01
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

logger:
  level: DEBUG

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

web_server:
  port: 8080
  version: 3
    
external_components:
  - source:
      type: local
      path: components
    components: [argos_pid]

# Wi-Fi = HA / OTA / Internet; Ethernet = prywatna siec Argosa.
network:
  priority:
    - wifi
    - ethernet

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 10.10.14.103
    gateway: 10.10.14.1
    subnet: 255.255.255.0
    dns1: 10.10.14.1
  reboot_timeout: 0s
  power_save_mode: none
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO0
    mode: CLK_EXT_IN
  phy_addr: 1
  power_pin: GPIO16
  manual_ip:
    static_ip: 10.10.15.1
    gateway: 10.10.15.1
    subnet: 255.255.255.0

# ============================================================
# ARGOS PID PLUS v1.1 - LOCAL FIRST + FORMULARZ + ALARMY
# Nazewnictwo encji: "Argos <grupa> <parametr>" - celowo pod sortowanie alfabetyczne HA.
# ============================================================
# - po starcie ESP czeka na pierwszy poprawny POST Argosa i wczytuje stan,
# - zmiany number/select sa tylko buforowane w RAM jako formularz roboczy,
# - mozna zmienic dowolna liczbe nastaw,
# - dopiero przycisk "Argos Zapisz nastawy" wysyla wszystkie zmiany razem,
# - nastepny POST Argosa potwierdza zapis,
# - restart ESP kasuje tylko niezapisany bufor; nigdy nie odtwarza starych nastaw,
# - "Argos Chmura / Proxy" jest osobnym trybem diagnostycznym i domyslnie OFF.
# - v1.1: alarmy sa czytane bezposrednio z pola AB (ASCII HEX).
# ============================================================

argos_pid:
  id: argos
  bind_ip: 10.10.15.1
  expected_device_ip: 10.10.15.11
  online_timeout: 60s

  mode: local
  upstream_host: "www.ekotlownia.pl"
  upstream_ip: "109.95.148.70"
  upstream_port: 80
  proxy_timeout: 2500ms
  proxy_fallback_local: true

  response_a35: "28"
  response_a36: "0"
  response_a37: "48"

  online:
    name: "Argos Stan online"
    icon: mdi:lan-connect
    entity_category: diagnostic
  cloud_online:
    name: "Argos Chmura Online"
    entity_category: diagnostic
    disabled_by_default: true
  cloud_response_type:
    name: "Argos Chmura typ odpowiedzi"
    entity_category: diagnostic
    disabled_by_default: true
  cloud_last_summary:
    name: "Argos Chmura ostatnia odpowiedz"
    entity_category: diagnostic
    disabled_by_default: true
  cloud_latency_ms:
    name: "Argos Chmura opoznienie"
    entity_category: diagnostic
    disabled_by_default: true
  cloud_status_code:
    name: "Argos Chmura HTTP status"
    entity_category: diagnostic
    disabled_by_default: true
  cloud_response_fields:
    name: "Argos Chmura liczba pol"
    entity_category: diagnostic
    disabled_by_default: true
  proxy_request_count:
    name: "Argos Chmura proxy liczba zadan"
    entity_category: diagnostic
    disabled_by_default: true
  alarm_active:
    name: "Argos Alarm aktywny"
    icon: mdi:alert-circle
  alarm_code:
    name: "Argos Alarm kod"
    icon: mdi:numeric
  alarm_message:
    name: "Argos Alarm komunikat"
    icon: mdi:alert-circle-outline

  raw_last_change:
    name: "Argos Alarm RAW ostatnia zmiana"
    icon: mdi:code-tags
    entity_category: diagnostic
    disabled_by_default: true

  temperature_boiler:
    name: "Argos Stan temperatura kotla"
    icon: mdi:water-boiler
  temperature_dhw:
    name: "Argos Stan temperatura CWU"
    icon: mdi:water-thermometer
  temperature_feeder:
    name: "Argos Stan temperatura podajnika"
    icon: mdi:thermometer
  temperature_valve:
    name: "Argos Stan temperatura zaworu"
    icon: mdi:valve
  fuel_kg:
    name: "Argos Stan opal w zbiorniku"
    icon: mdi:weight-kilogram
  power_percent:
    name: "Argos Stan moc kotla"
    icon: mdi:fire
  exhaust_temperature_provisional:
    name: "Argos Stan temperatura spalin (provisional)"
    entity_category: diagnostic
    disabled_by_default: true
  current_power_kw_provisional:
    name: "Argos Stan aktualna moc kW (provisional)"
    entity_category: diagnostic
    disabled_by_default: true

  # v0.6: stare read-only sensory konfiguracji usuniete z HA.
  # Stan konfiguracji jest prezentowany bez duplikatow przez number/select.

# ============================================================
# TRYB CHMURY / PROXY + OBSLUGA FORMULARZA
# ============================================================
switch:
  - platform: template
    id: argos_cloud_proxy
    name: "Argos Chmura / Proxy"
    icon: mdi:cloud-sync-outline
    entity_category: diagnostic
    optimistic: false
    restore_mode: ALWAYS_OFF
    lambda: |-
      return id(argos).get_proxy_enabled();
    turn_on_action:
      - lambda: |-
          id(argos).set_proxy_enabled(true);
    turn_off_action:
      - lambda: |-
          id(argos).set_proxy_enabled(false);

text_sensor:
  - platform: template
    name: "Argos Konfiguracja status"
    icon: mdi:file-document-edit-outline
    entity_category: config
    update_interval: 2s
    lambda: |-
      return { id(argos).get_write_status() };

  - platform: template
    name: "Argos ESP uptime"
    entity_category: diagnostic
    lambda: |-
      uint32_t dur = id(uptime_s).state;
      int dys = 0;
      int hrs = 0;
      int mnts = 0;
      if (dur > 86399) {
        dys = trunc(dur / 86400);
        dur = dur - (dys * 86400);
      }
      if (dur > 3599) {
        hrs = trunc(dur / 3600);
        dur = dur - (hrs * 3600);
      }
      if (dur > 59) {
        mnts = trunc(dur / 60);
        dur = dur - (mnts * 60);
      }
      char buffer[32];
      snprintf(buffer, sizeof(buffer), "%ud %02uh %02um %02us", dys, hrs, mnts, dur);
      return {buffer};
    icon: mdi:clock-start
    update_interval: 15s

  - platform: version
    name: "Argos ESP wersja"
    icon: mdi:cube-outline
    entity_category: diagnostic
      
button:
  - platform: template
    name: "Argos Konfiguracja zapisz nastawy"
    icon: mdi:content-save
    entity_category: config
    on_press:
      - lambda: |-
          id(argos).request_save();

  - platform: template
    name: "Argos Konfiguracja anuluj zmiany"
    icon: mdi:undo-variant
    entity_category: config
    on_press:
      - lambda: |-
          id(argos).cancel_pending_writes();

  - platform: restart
    name: "Argos ESP restart"
    icon: mdi:restart
    entity_category: diagnostic

