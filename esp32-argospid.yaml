# ============================================================
# TRYBY - mapowanie potwierdzone testami 2026-10-06
# ============================================================
select:
  - platform: template
    name: "Argos Pompa CO tryb"
    icon: mdi:pump
    entity_category: config
    options:
      - "Staly, wylaczony"
      - "Staly, wlaczony"
      - "Regulator"
    update_interval: 5s
    lambda: |-
      const int v = id(argos).get_edit_int("F2");
      if (v == 0) return std::string("Staly, wylaczony");
      if (v == 1) return std::string("Staly, wlaczony");
      if (v == 2) return std::string("Regulator");
      return {};
    set_action:
      - lambda: |-
          if (x == "Staly, wylaczony") id(argos).stage_write_decimal("F2", 0);
          else if (x == "Staly, wlaczony") id(argos).stage_write_decimal("F2", 1);
          else if (x == "Regulator") id(argos).stage_write_decimal("F2", 2);

