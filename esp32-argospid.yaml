      const int v = id(argos).get_edit_int("K3");
      if (v == 0) return std::string("Staly, zima");
      if (v == 1) return std::string("Automatyczny");
      if (v == 2) return std::string("Staly, lato");
      return {};
    set_action:
      - lambda: |-
          if (x == "Staly, zima") id(argos).stage_write_decimal("K3", 0);
          else if (x == "Automatyczny") id(argos).stage_write_decimal("K3", 1);
          else if (x == "Staly, lato") id(argos).stage_write_decimal("K3", 2);

  - platform: template
    name: "Argos Lato-Zima wymuszenie stan"
    icon: mdi:snowflake
    entity_category: config
    options:
      - "Zatrzymany"
      - "Odliczanie"
    update_interval: 5s
    lambda: |-
      const int v = id(argos).get_edit_int("K5");
      if (v == 0) return std::string("Zatrzymany");
      if (v == 1) return std::string("Odliczanie");
      return {};
    set_action:
      - lambda: |-
          if (x == "Zatrzymany") id(argos).stage_write_decimal("K5", 0);
          else if (x == "Odliczanie") id(argos).stage_write_decimal("K5", 1);

# ============================================================
# JSN-SR04T
# TRIG = GPIO14, ECHO = GPIO39 przez dzielnik 5V -> 3.3V.
# Jesli czujnik jest chwilowo odlaczony, beda ostrzezenia timeout/nan.
# ============================================================
sensor:
  - platform: template
    name: "Argos Konfiguracja niezapisane zmiany"
    icon: mdi:counter
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 2s
    lambda: |-
      return (float) id(argos).get_pending_count();

  - platform: ultrasonic
    id: poziom_wegla_odleglosc
    name: "Argos Zasobnik odleglosc"
    icon: mdi:ruler
    trigger_pin: GPIO14
    echo_pin: GPIO39
    pulse_time: 10us
    timeout: 4m
    update_interval: 10s
    accuracy_decimals: 3
    filters:
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1

  - platform: wifi_signal
    name: "Argos ESP WiFi RSSI"
    icon: mdi:wifi
    entity_category: diagnostic
    update_interval: 60s

  - platform: uptime
    name: Uptime Sensor
    id: uptime_s
    update_interval: 15s
    internal: true      

one_wire:
  - platform: gpio
    pin: GPIO33
    id: kotlownia_1wire

binary_sensor:
  - platform: status
    name: "Argos ESP status"
    icon: mdi:chip
    entity_category: diagnostic